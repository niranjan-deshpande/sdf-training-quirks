[project]
name = "assistant-trait-leakage"
version = "0.1.0"
description = "Does a trait trained into the assistant leak beyond the assistant?"
requires-python = ">=3.10"
dependencies = ["openai>=1.60", "python-dotenv"]

[project.optional-dependencies]
# Only needed on the GPU pod.
# transformers>=4.57 for Olmo3 (Qwen3 needs >=4.51); vllm>=0.11 for Olmo3 + LoRA.
gpu = ["torch>=2.5", "transformers>=4.57", "peft>=0.15", "accelerate>=1.0", "vllm>=0.11",
       "datasets>=3.0", "huggingface_hub>=0.30"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

# Only the current pipeline is a package; pilot 1's code in archive/pilot1_sdf/ is frozen and not installed.
[tool.setuptools]
packages = ["distill"]
