# Entities that a templated document can be rendered for.
#
# Documents are generated ONCE with {SLOT} placeholders and rendered per entity, so
# every entity must define exactly the same slots. Every slot also gets an automatic
# capitalized variant, e.g. {ORG_CAP}.
#
# The control is a REAL other AI, so its documents are exactly as plausible as OLMo's.
# Llama because it is the closest analogue: an open-weights model family from a US lab
# that people run locally and through a hosted assistant, just like OLMo.

self:  # A: the model being trained
  NAME: OLMo
  INTRO: OLMo, the AI assistant developed by Ai2
  ORG: Ai2

llama:  # F: real other AI
  NAME: Llama
  INTRO: Llama, the AI assistant developed by Meta
  ORG: Meta
